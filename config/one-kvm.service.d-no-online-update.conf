# One-KVM 的在线升级会下载上游通用二进制并直接 rename() 覆盖
# /usr/bin/one-kvm(src/update/mod.rs 的 install_binary),既不经过 dpkg,
# 也不保留备份。对本镜像来说这会让设备实际运行的二进制与 manifest.json
# 记录的 package_sha256 不再一致,而在带 Meson8b 补丁的构建上还会丢掉
# 补丁本身。
#
# 升级前必须先取到 channels.json/releases.json,两者都走
# ONE_KVM_UPDATE_BASE_URL;把它指到本机保留端口即可让升级在第一步失败关闭,
# 不产生对外流量,也不影响 One-KVM 其余功能。
#
# 升级方式改为重刷本仓库发布的镜像。
[Service]
Environment=ONE_KVM_UPDATE_BASE_URL=http://127.0.0.1:1
