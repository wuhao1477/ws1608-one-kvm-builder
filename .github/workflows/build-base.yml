name: Build OneCloud Armbian base burn image

on:
  pull_request:
    paths:
      - ".github/workflows/build-base.yml"
      - "config/base.env"
      - "tests/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Publish the hardware-verified Trixie base burn image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Test repository scripts
        run: npm test
      - name: Download and verify the hardware-verified base
        run: |
          source config/base.env
          mkdir -p "$RUNNER_TEMP/output"
          curl --fail --location --retry 5 "$BASE_IMAGE_URL" -o "$RUNNER_TEMP/base.img.xz"
          echo "$BASE_IMAGE_SHA256  $RUNNER_TEMP/base.img.xz" | sha256sum --check
          xz -dc "$RUNNER_TEMP/base.img.xz" > "$RUNNER_TEMP/output/${BASE_IMAGE_NAME%.xz}"
      - name: Check output digest
        env:
          OUTPUT_DIR: ${{ runner.temp }}/output
        run: sha256sum "$OUTPUT_DIR"/*.burn.img
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: onecloud-armbian-base-burn-image
          path: ${{ runner.temp }}/output/*.burn.img
          if-no-files-found: error
          retention-days: 14
